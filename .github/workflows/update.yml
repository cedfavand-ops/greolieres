name: Mise à jour des prévisions

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer les prévisions
        env:
          DATACAKE_TOKEN: ${{ secrets.DATACAKE_TOKEN }}
          DATACAKE_DEVICE_ID: ${{ secrets.DATACAKE_DEVICE_ID }}
          DATACAKE_TEMP_FIELD: ${{ secrets.DATACAKE_TEMP_FIELD }}
        run: python scripts/update_forecast.py

      - name: Commit et push si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json data/bias_state.json
          git diff --cached --quiet || git commit -m "Mise à jour prévisions [skip ci]"
          git push
